<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Oculta la página hasta que carguen los estilos (evita ver el HTML sin diseño un instante) -->
  <style>.pagina--cargando{opacity:0;animation:respaldo-visible 0s 2s forwards}@keyframes respaldo-visible{to{opacity:1}}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · ArmadorPC</title>
  <meta name="description" content="Ingresa a tu cuenta de ArmadorPC.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap">
  <script type="module" src="/src/paginas/ingresar.js"></script>
</head>
<body class="pagina pagina--cargando">
<main class="pagina__contenido acceso">
    <div class="acceso__arte">
      <a class="logo" href="/"><img class="logo__imagen" src="/logo-icono.svg" alt="" width="44" height="44"><span class="logo__texto">Armador<b class="logo__marca">PC</b></span></a>
      <h2 class="acceso__lema">Tu cuenta guarda todo lo que armas</h2>
      <ul class="acceso__beneficios" id="beneficios"></ul>
    </div>
    <div class="acceso__zona">
      <div class="caja caja--sombra acceso__caja">
        <h1 class="acceso__titulo">Ingresar</h1>
        <p class="acceso__texto">¿No tienes cuenta? <a href="/registro.html" id="ir-registro">Créala gratis</a></p>
        <form class="formulario" id="formulario" novalidate>
          <div class="aviso aviso--error" id="error" hidden></div>
          <label class="formulario__campo"><span class="formulario__etiqueta">Correo</span><input name="correo" type="email" autocomplete="email" required></label>
          <label class="formulario__campo"><span class="formulario__etiqueta">Contraseña</span><input name="contrasena" type="password" autocomplete="current-password" required></label>
          <button class="boton boton--violeta boton--grande boton--ancho">Ingresar</button>
        </form>
        <div class="acceso__pruebas"><b>Cuentas de prueba</b><br>Usuario: demo@armadorpc.com · Demo12345<br>Administrador: admin@armadorpc.com · Admin12345</div>
      </div>
    </div>
</main>
</body>
</html>
