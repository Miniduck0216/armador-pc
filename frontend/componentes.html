<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Componentes · ArmadorPC</title>
  <meta name="description" content="Biblioteca de componentes de PC con precios de tiendas de Ecuador.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap">
  <script type="module" src="/src/paginas/componentes.js"></script>
</head>
<body>
<main>
  <section class="cabecera-pagina">
    <div class="contenedor">
      <div class="migas"><a href="/">Inicio</a> / <span id="miga">Componentes</span></div>
      <h1 id="titulo">Biblioteca de componentes</h1>
      <p id="descripcion">Busca, filtra y compara piezas con el mejor precio de hoy en tiendas de Ecuador.</p>
      <div class="mosaicos compactos" id="categorias" style="margin-top:24px"></div>
    </div>
  </section>
  <section class="seccion">
    <div class="contenedor biblioteca">
      <aside class="filtros" id="filtros">
        <div class="caja">
          <label class="campo"><span>Buscar</span><input id="f-buscar" type="search" placeholder="Modelo o marca"></label>
          <div class="campo"><span>Precio</span>
            <div class="dos-campos">
              <label class="campo-precio">$<input id="f-min" type="number" min="0" placeholder="Mín"></label>
              <label class="campo-precio">$<input id="f-max" type="number" min="0" placeholder="Máx"></label>
            </div>
          </div>
          <label class="casilla"><input type="checkbox" id="f-stock"> Solo con stock</label>
        </div>
        <div class="caja"><h4>Gama</h4><div class="lista-casillas" id="f-gamas"></div></div>
        <div class="caja"><h4>Marca</h4><div class="lista-casillas" id="f-marcas"></div></div>
        <button class="boton secundario ancho" id="limpiar" type="button">Limpiar filtros</button>
      </aside>
      <div>
        <div class="aviso info que-mirar oculto" id="que-mirar"></div>
        <div class="barra-resultados">
          <div class="fila"><button class="boton secundario pequeno boton-filtros" id="ver-filtros" type="button">Filtros</button><b id="conteo">Cargando…</b></div>
          <label class="fila pequeno tenue">Ordenar por
            <select id="f-orden">
              <option value="relevancia">Relevancia</option>
              <option value="precio_asc">Precio: menor a mayor</option>
              <option value="precio_desc">Precio: mayor a menor</option>
              <option value="rendimiento">Rendimiento</option>
              <option value="bajada">Mayor bajada de precio</option>
              <option value="nombre">Nombre</option>
            </select>
          </label>
        </div>
        <div class="grilla auto" id="resultados"></div>
        <div class="paginacion" id="paginacion"></div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
