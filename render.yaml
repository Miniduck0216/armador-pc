# Despliegue en Render (plan Free).
# Pasos: en render.com → New → Blueprint → elegir el repositorio de GitHub.
# En el plan Free no hay disco permanente: la base SQLite se vuelve a crear
# con los datos de prueba cada vez que el servicio se reinicia.
services:
  - type: web
    name: armadorpc
    runtime: node
    plan: free
    # --include=dev: Render usa NODE_ENV=production y npm omitiría nest, typescript y vite
    buildCommand: npm install --include=dev && npm install --include=dev --prefix backend && npm install --include=dev --prefix frontend && npm run build
    startCommand: npm start
    healthCheckPath: /api/inicio
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRETO
        generateValue: true
      - key: PRECIOS_MODO
        value: demo
      - key: PRECIOS_AL_INICIAR
        value: "no"
